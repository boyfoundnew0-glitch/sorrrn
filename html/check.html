<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sorrrn — 전시 PC 점검</title>
<style>
  :root { --bg-base: #FFFCF6; --text-primary: #33251A; --text-secondary: #6F6258; --text-muted: #8E8278;
          --border-default: #6F6258; --accent-mint: #A1DFB2; --accent-lavender: #A285C2; --accent-tangerine: #FF5424; --bg-dark: #33251A; --text-inverse: #FFFCF6; }
  body { margin: 0; padding: 40px 56px; background: var(--bg-base); color: var(--text-primary);
         font-family: -apple-system, "Noto Sans KR", sans-serif; font-size: 15px; line-height: 1.6; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; max-width: 980px; }
  td { border-top: 1px solid var(--border-default); padding: 8px 12px 8px 0; vertical-align: top; }
  td:first-child { width: 260px; color: var(--text-secondary); }
  .ok { color: #2a8a3a; font-weight: 700; } .bad { color: var(--accent-tangerine); font-weight: 700; }
  .row { display: -webkit-box; display: flex; margin: 28px 0 8px; }
  .row > * + * { margin-left: 32px; }
  .demo { position: relative; width: 200px; height: 120px; border: 1px solid var(--border-default); }
  .demo .c { position: absolute; left: 60px; top: 20px; width: 80px; height: 80px; border-radius: 50%;
             background: var(--accent-lavender); opacity: 0;
             transform: scale(0.001); transition: transform 1.4s steps(21, end), opacity 0s linear 1.4s; }
  .demo:hover .c { transform: scale(1); opacity: 1; transition: transform 1.4s steps(21, end), opacity 0s; }
  button { font: inherit; padding: 10px 20px; border-radius: 50px; border: 0; background: var(--bg-dark); color: var(--text-inverse); cursor: pointer; }
  small { color: var(--text-muted); }
</style>
</head>
<body>
<h1>전시 PC 점검</h1>
<p class="lead">이 화면을 그대로 캡처해서 보내주세요. 브라우저·캐시·지원 기능을 확인합니다.</p>
<table id="t"></table>

<div class="row">
  <div><div class="demo"><span class="c"></span></div><small>여기에 마우스를 올려 보세요 — 보라 원이 천천히 커지면 정상</small></div>
</div>

<p><button id="reset" type="button">캐시·서비스 워커 초기화 후 다시 불러오기</button>
<br><small>사이트가 예전 모습으로 보일 때 한 번 누르세요.</small></p>

<script>
(function () {
  var t = document.getElementById("t");
  function row(k, v, good) {
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + k + "</td><td class='" + (good === undefined ? "" : good ? "ok" : "bad") + "'>" + v + "</td>";
    t.appendChild(tr);
  }
  var ua = navigator.userAgent;
  var mv = ua.match(/Version\/([\d.]+)/), mac = ua.match(/Mac OS X ([\d_]+)/);
  var sv = mv ? parseFloat(mv[1]) : 0;
  row("브라우저", ua);
  row("Safari 버전", mv ? mv[1] + (sv < 15.4 ? "  (15.4 미만 — 예전 버전)" : "") : "Safari 아님", mv ? sv >= 15.4 : undefined);
  row("macOS (표시값)", mac ? mac[1].replace(/_/g, ".") : "-");
  row("화면", screen.width + " × " + screen.height + "  · 창 " + innerWidth + " × " + innerHeight + "  · 배율 " + devicePixelRatio);
  function sup(p, v) { try { return CSS.supports(p, v); } catch (e) { return false; } }
  function supSel(s) { try { return CSS.supports("selector(" + s + ")"); } catch (e) { try { document.querySelector(s); return true; } catch (e2) { return false; } } }
  row(":focus-visible 지원", supSel(":focus-visible") ? "예" : "아니오 (사이트에서 대응 완료)", true);
  row("inset 속성 지원", sup("inset", "0") ? "예" : "아니오 (사이트에서 대응 완료)", true);
  row("flex gap 지원", sup("gap", "1px") ? "예" : "아니오 (사이트에서 대응 완료)", true);
  var rm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  row("동작 줄이기(시스템 설정)", rm ? "켜짐 — 사이트 모션이 꺼집니다 (시스템 설정 > 손쉬운 사용 > 디스플레이)" : "꺼짐", !rm);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistration("../").then(function (r) {
      row("서비스 워커", r ? (r.active ? "설치됨 (최신 파일 강제)" : "설치 중") : "아직 없음 — 사이트를 한 번 열면 설치됩니다", !!r);
      row("이 페이지 제어", navigator.serviceWorker.controller ? "예" : "아니오 (새로고침하면 예)");
    });
  } else row("서비스 워커", "지원 안 함", false);
  // 지금 배포된 버전과 이 브라우저가 가진 버전 비교
  fetch("kitbasic.html?nc=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (h) {
    var m = h.match(/detail\.css\?v=([0-9a-f]+)/);
    row("배포된 상세 CSS 버전", m ? m[1] : "-");
  }).catch(function () { row("배포 버전 확인", "네트워크 오류", false); });
  // 크기 0.001 → 1 전환이 실제로 진행되는지 (호버 도형·명함 플립과 같은 방식)
  var d = document.createElement("div");
  d.style.cssText = "position:absolute;left:-999px;top:0;width:10px;height:10px;transform:scale(0.001);transition:transform 1s linear";
  document.body.appendChild(d);
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    d.style.transform = "scale(1)";
    setTimeout(function () {
      var tr = getComputedStyle(d).transform, a = 1;
      var mm = tr.match(/matrix\(([^,]+)/); if (mm) a = parseFloat(mm[1]);
      row("크기 전환 진행 (0.5초 시점)", a.toFixed(2) + (a > 0.1 && a < 0.95 ? "  정상" : "  이상"), a > 0.1 && a < 0.95);
    }, 500);
  }); });

  document.getElementById("reset").addEventListener("click", function () {
    var jobs = [];
    if ("serviceWorker" in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).then(function () { location.href = "combined.html?t=" + Date.now(); }, function () { location.href = "combined.html?t=" + Date.now(); });
  });
})();
</script>
</body>
</html>
